<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Geometría Computacional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gui">
        <span style="text-align: center; margin-bottom: 10px;">Vectores</span>
        <div class="vector">
            <span>Vector U = </span>
            <input name="x" data-vector="U" placeholder="x" type="number">
            <input name="y" data-vector="U" placeholder="y" type="number">
            <input name="z" data-vector="U" placeholder="z" type="number">
        </div>
        <div class="vector">
            <span>Vector V = </span>
            <input name="x" data-vector="V" placeholder="x" type="number">
            <input name="y" data-vector="V" placeholder="y" type="number">
            <input name="z" data-vector="V" placeholder="z" type="number">
        </div>
        <div class="coolButton" onclick="graficar()">Graficar</div>

        <span style="text-align: center; margin-bottom: 10px; margin-top: 10px;">Creación de Figuras</span>
        <div class="row">
            <div class="column">
                <div class="coolButton" onclick="creationOfFigures('box')">Cube</div>
            </div>
            <div class="column">
                <div class="coolButton" onclick="creationOfFigures('torus')">Torus</div>
            </div>
            <div class="column">
                <div class="coolButton" onclick="creationOfFigures('cone')">Cone</div>
            </div>
        </div>

        <span style="text-align: center; margin-bottom: 10px; margin-top: 10px;">Transformaciones</span>
        <div class="row">
            <div class="column">
                <div class="coolButton" onclick="translateOBJ('translate')">Translate</div>
            </div>
            <div class="column">
                <div class="coolButton" onclick="translateOBJ('scale')">Scale</div>
            </div>
            <div class="column">
                <div class="coolButton" onclick="translateOBJ('rotate')">Rotate</div>
            </div>
        </div>
    </div>

    <!-- Mensaje de advertencia: parámetros inválidos -->
    <div id="warningMssgI" style="display:none; position:absolute; top:10px; left:10px; background:red; color:white; padding:8px;">
        Los parámetros ingresados no son válidos
    </div>

    <!-- Mensaje de advertencia: no hay figuras creadas -->
    <div id="warningMssgnf" style="display:none; position:absolute; top:50px; left:10px; background:red; color:white; padding:8px;">
        No hay figuras creadas para transformar
    </div>

    <div id="selectModel" name="selectModel" class="gui" style="display:none; left: 10px; top: 10px; right: auto;">
        <span style="text-align: center; margin-bottom: 10px; margin-top: 10px;"> - Select the Object to apply transformation</span>
        <div id="myList" name="myList"></div>
    </div>

    <canvas id="app"></canvas>

   
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
